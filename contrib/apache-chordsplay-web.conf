# Example: Apache as the reverse proxy in front of the ChordsPlay web app
# (contrib/chordsplay-web.service, 127.0.0.1:8616), published at /chordsplay/ of an
# HTTPS virtual host. Include it there, e.g. as conf.d/chordsplay.conf. Needs mod_proxy,
# mod_proxy_http and mod_headers. See docs/web.md.
#
# Login: any authentication that sets REMOTE_USER will do. The app gets the name as
# X-Remote-User, maps it to a database user (CHORDSPLAY_USER_MAP) and refuses proxied
# requests without it. Basic authentication is shown below; with single sign-on
# (mod_auth_openidc: AuthType openid-connect) only the two Auth lines differ.
#
# Exception: everything below /chordsplay/d/ is for clients that can't log in, each
# with its own key made on the logged-in page:
#   d/<code>/          display pages (TV, tablet): a code valid for 12 hours, read only
#   d/tv/              a TV paired once: a cookie token, read only
#   d/bridge/<token>/  the amp bridge (mmp/bridge.py): follows the session, reports
#                      the amp's state, uploads presets, takes and level surveys

RedirectMatch ^/chordsplay$ /chordsplay/
# flushpackets: the event streams (api/events, d/.../events) must not be buffered
ProxyPass        /chordsplay/ http://127.0.0.1:8616/ flushpackets=on
ProxyPassReverse /chordsplay/ http://127.0.0.1:8616/

<Location "/chordsplay/">
    AuthType Basic
    AuthName "ChordsPlay"
    AuthUserFile /etc/apache2/chordsplay.htpasswd
    Require valid-user

    # What a client sends itself is always dropped; set only after a login.
    RequestHeader unset X-Remote-User
    RequestHeader set X-Remote-User "expr=%{REMOTE_USER}" "expr=-n %{REMOTE_USER}"
    # always: tells the app the request came through here and needs a user
    RequestHeader set X-ChordsPlay-Proxy "1"
</Location>

# after the block above, so it wins for these paths
<Location "/chordsplay/d/">
    AuthType None
    Require all granted
</Location>
