# ChordsPlay web app (repo ChordsPlay, web/; user unit chordsplay-web.service on
# host6, 127.0.0.1:8616). Installed as /etc/apache2/public.d/locations/chordsplay.conf,
# which only the :443 vhost includes.
#
# Login: Authelia via OIDC, <Location "/chordsplay/"> in /etc/apache2/homeauth.conf
# (AuthType openid-connect, Require valid-user). mod_auth_openidc sets REMOTE_USER
# from preferred_username; this file passes it on as X-Remote-User. The app maps
# it to a database user (CHORDSPLAY_USER_MAP) and refuses proxied requests
# without it.
#
# Exception: everything below /chordsplay/d/ (clients that can't log in), each with
# its own key made on the logged-in page:
#   d/<code>/          display pages (TV, tablet): a code valid for 12 hours, read only
#   d/tv/              a TV paired once: a cookie token, read only
#   d/bridge/<token>/  the amp bridge (mmp/bridge.py): follows the session, reports
#                      the amp's state, uploads presets and takes
# homeauth.conf has, after the /chordsplay/ block:
#   <Location "/chordsplay/d/">
#       AuthType None
#       Require all granted
#   </Location>

RedirectMatch ^/chordsplay$ /chordsplay/
# flushpackets: the event streams (api/events, d/.../events) must not be buffered
ProxyPass        /chordsplay/ http://127.0.0.1:8616/ flushpackets=on
ProxyPassReverse /chordsplay/ http://127.0.0.1:8616/

<Location "/chordsplay/">
    # What a client sends itself is always dropped; set only after a login.
    # "%{REMOTE_USER}" is the ap_expr variable (see media-find.conf).
    RequestHeader unset X-Remote-User
    RequestHeader set X-Remote-User "expr=%{REMOTE_USER}" "expr=-n %{REMOTE_USER}"
    # always: tells the app the request came through here and needs a user
    RequestHeader set X-ChordsPlay-Proxy "1"
</Location>
