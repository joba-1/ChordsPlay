# ChordsPlay sync service reverse-proxy for Apache (host4).
# Requires: a2enmod proxy proxy_http  (or LoadModule proxy/proxy_http)
# Drop into the serving <VirtualHost> (the same one that fronts Trac etc.).

ProxyPass        /chordsplay/  http://127.0.0.1:8615/
ProxyPassReverse /chordsplay/  http://127.0.0.1:8615/

# Optional: restrict to the LAN / VPN (adjust to your subnets)
# <Location /chordsplay/>
#     Require ip 10.0.0.0/16 10.0.0.0/8 127.0.0.1
# </Location>
